<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareGen Intelligence — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════
   CareGen Intelligence — Coming Soon
   Brand: dominant #612CAD (purple) · secondary #050025 (near-black)
          accent #F5B533 (amber). Matches how-it-works.html / the
          CareGen Brand Identity Guidelines.
   ═══════════════════════════════════════════════════════════════ */

:root {
  --cg-dominant:  #612CAD;
  --cg-mid:       #220749;
  --cg-secondary: #050025;
  --cg-accent:    #F5B533;

  --text-1: rgba(255,255,255,0.94);
  --text-2: rgba(255,255,255,0.68);
  --text-3: rgba(255,255,255,0.48);

  --font: 'Manrope', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
}

body {
  background: var(--cg-secondary);
  color: var(--text-1);
  font-family: var(--font);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  position: relative;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }

/* ─── Fixed background: soft blurred color blooms ─── */
.page-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bloom {
  position: absolute;
  width: 70vw; height: 120vh; top: -10vh;
  border-radius: 50%;
  filter: blur(120px);
}
.bloom--left {
  left: -26vw;
  background: radial-gradient(ellipse at 35% 35%, var(--cg-dominant) 0%, transparent 68%);
  opacity: 0.38;
}
.bloom--right {
  right: -26vw;
  background: radial-gradient(ellipse at 65% 35%, var(--cg-accent) 0%, transparent 68%);
  opacity: 0.22;
}

/* ─── Content ─── */
.wrap {
  position: relative;
  z-index: 1;
  max-width: 560px;
  width: 100%;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.cg-logo {
  width: 300px;
  max-width: 70vw;
  height: auto;
  margin-bottom: 36px;
  opacity: 0.95;
}

h1 {
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-1);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 100px;
  padding: 6px 16px;
  margin: 16px 0 56px;
}

.cta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 13px 26px;
  border-radius: 100px;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.btn-primary {
  background: var(--cg-dominant);
  color: #fff;
}

.btn-outline {
  background: rgba(255,255,255,0.06);
  color: var(--text-1);
  border: 1px solid rgba(255,255,255,0.22);
}

.btn:hover {
  transform: translateY(-1px);
  opacity: 0.92;
}

@media (max-width: 480px) {
  .cta-row { flex-direction: column; width: 100%; }
  .btn { justify-content: center; }
}
</style>
</head>
<body>

<div class="page-bg" aria-hidden="true">
  <div class="bloom bloom--left"></div>
  <div class="bloom bloom--right"></div>
</div>

<div class="wrap">
  <img src="images/CG_Full_Color_Primary_Logo_White.svg" alt="CareGen Intelligence" class="cg-logo">
  <h1>Coming Soon</h1>
  <div class="cta-row">
    <a href="https://www.healthgen.io/contact-healthgen" target="_blank" rel="noopener" class="btn btn-primary">Talk to Our Team</a>
    <a href="https://www.hgecosystem.io/index.html" class="btn btn-outline">Back to HG Ecosystem</a>
  </div>
</div>

</body>
</html>
